<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درخواست طراحی سایت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --text-color: #333;
            --light-gray: #f5f5f5;
            --gradient: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }

        body {
            background-color: var(--light-gray);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .request-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .request-container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .request-info {
            padding: 3rem;
            background: var(--gradient);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .request-info::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60');
            background-size: cover;
            background-position: center;
            opacity: 0.1;
            z-index: 0;
        }

        .request-info h2 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .request-info p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
        }

        .info-list {
            list-style: none;
            position: relative;
            z-index: 1;
        }

        .info-list li {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .info-list i {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .request-form {
            padding: 3rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .submit-btn {
            background: var(--gradient);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
            font-size: 1.1rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: white;
            color: var(--primary-color);
            padding: 0.8rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background: var(--gradient);
            color: white;
        }

        .back-btn i {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .request-container {
                grid-template-columns: 1fr;
            }

            .request-info {
                padding: 2rem;
            }

            .request-form {
                padding: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="request-page">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            بازگشت به صفحه اصلی
        </a>
        <div class="request-container" data-aos="fade-up">
            <div class="request-info">
                <h2>درخواست طراحی سایت</h2>
                <p>برای دریافت مشاوره رایگان و درخواست طراحی سایت، فرم زیر را پر کنید. ما در اسرع وقت با شما تماس خواهیم گرفت.</p>
                <ul class="info-list">
                    <li>
                        <i class="fas fa-check-circle"></i>
                        مشاوره رایگان قبل از شروع پروژه
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        طراحی اختصاصی و منحصر به فرد
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        پشتیبانی 24 ساعته
                    </li>
                    <li>
                        <i class="fas fa-check-circle"></i>
                        تحویل به موقع پروژه
                    </li>
                </ul>
            </div>
            <form class="request-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullname">نام و نام خانوادگی</label>
                        <input type="text" id="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">شماره تماس</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">ایمیل</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="website-type">نوع وبسایت</label>
                        <select id="website-type" required>
                            <option value="">انتخاب کنید</option>
                            <option value="corporate">شرکتی</option>
                            <option value="shop">فروشگاهی</option>
                            <option value="blog">وبلاگ</option>
                            <option value="portfolio">نمونه کار</option>
                            <option value="other">سایر</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">توضیحات پروژه</label>
                    <textarea id="description" rows="5" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="budget">بودجه پیش‌بینی شده (تومان)</label>
                        <input type="number" id="budget" required>
                    </div>
                    <div class="form-group">
                        <label for="timeline">زمان مورد نیاز برای تحویل (روز)</label>
                        <input type="number" id="timeline" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">ارسال درخواست</button>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000,
            once: true
        });
    </script>
</body>
</html>
